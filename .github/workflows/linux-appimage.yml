# The Linux AppImage of each release (tools/make_appimage.py), built on a Linux runner and attached to the release
# itself: the release is assembled on Windows (tools/make_release.py), and the AppImage needs Linux (the translator's
# NativeAOT build for linux-x64, appimagetool). It holds the build kit only, no game files, as the setup does, and with
# --toolchain the compiler and libraries a build reads (tools/linux_toolchain.py), so players need no packages.
name: Linux AppImage

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build the AppImage for (it replaces one already attached)'
        required: true

permissions:
  contents: write   # gh release upload

concurrency:
  group: linux-appimage-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 90   # the toolchain's first downloads (3.3 GB) and its SDL, dav1d and runtime compiles
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: astral-sh/setup-uv@v6
      - name: Shader compilers and the toolchain's build tools
        # make_appimage.py compiles the runtime's own shaders (tools/build_shaders.py: glslc, spirv-as, spirv-val);
        # tools/linux_toolchain.py runs make, tar with xz, pkg-config, wayland-scanner (without it SDL leaves Wayland
        # out) and readelf, and its end check runs a program linked with the Vulkan loader
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc spirv-tools make xz-utils pkg-config libwayland-bin binutils libvulkan1
      - name: Shader translator and VMA
        run: |
          uv venv -q --python 3.12 .venv
          uv pip install -q --python .venv/bin/python pillow
          .venv/bin/python tools/build_xlate.py
          .venv/bin/python -c 'import sys; sys.path.insert(0, "tools"); import build_game; print("VMA:", build_game.vma_include())'
      - name: Button art from the release's app zip
        run: |
          # make_release.py uploads the zip with the release; wait for it if the release was published first
          for i in $(seq 1 20); do
            gh release download "$TAG" -p 'NX2navi-app-*.zip' -D "$RUNNER_TEMP/app" && break
            echo "no app zip on $TAG yet ($i)"; sleep 30
          done
          unzip -q "$RUNNER_TEMP"/app/NX2navi-app-*.zip 'prompt-art/*' -d "$RUNNER_TEMP/app" || true
          ls -d "$RUNNER_TEMP/app/prompt-art" 2>/dev/null || echo "::warning::no prompt-art in the app zip: the AppImage's builds keep the Switch prompts"
      - name: Toolchain downloads
        # LLVM, the Steam Runtime SDK, CMake and the sources tools/linux_toolchain.py builds (about 3.3 GB), each
        # checked against its sha256 when used; the pins live in these three files
        uses: actions/cache@v4
        with:
          path: toolchain/release-dl
          key: toolchain-dl-${{ hashFiles('tools/linux_toolchain.py', 'tools/make_release_linux.py', 'tools/make_release.py') }}
      - name: AppImage
        run: |
          uv python install -q 3.14
          py=$(find "$(uv python dir)" -maxdepth 1 -type d -name 'cpython-3.14.*-linux-x86_64-gnu' | sort -V | tail -1)
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          art=(); [ -d "$RUNNER_TEMP/app/prompt-art" ] && art=(--prompt-art "$RUNNER_TEMP/app/prompt-art")
          APPIMAGE_EXTRACT_AND_RUN=1 .venv/bin/python tools/make_appimage.py --python "$py" \
            --appimagetool "$RUNNER_TEMP/appimagetool" --out dist --toolchain "${art[@]}"
          appimage=$(ls dist/NX2navi-Linux-*-x86_64.AppImage)
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --help | head -3
          (cd dist && sha256sum NX2navi-Linux-*-x86_64.AppImage > SHA256SUMS-linux.txt && cat SHA256SUMS-linux.txt)
      - name: Attach to the release
        run: gh release upload "$TAG" --clobber dist/NX2navi-Linux-*-x86_64.AppImage dist/SHA256SUMS-linux.txt
